<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="520" rx="18" fill="url(#bg2)"/>
  <text x="40" y="52" fill="#e2e8f0" font-size="26" font-weight="700">ah-enrollment-ui — Stateless Wizard + Distributed Session</text>
  <text x="40" y="82" fill="#7c8aa5" font-size="16">Each wizard step can land on ANY pod. Session state lives in Redis, never in the pod.</text>

  <!-- Browser -->
  <rect x="40" y="130" width="190" height="260" rx="14" fill="#1e293b" stroke="#38bdf8"/>
  <text x="135" y="160" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="middle">Employee Browser</text>
  <g font-size="13" fill="#cbd5e1">
    <rect x="60" y="180" width="150" height="34" rx="7" fill="#0f172a" stroke="#334155"/><text x="72" y="202">Step 1 · AD&amp;D tier</text>
    <rect x="60" y="222" width="150" height="34" rx="7" fill="#0f172a" stroke="#334155"/><text x="72" y="244">Step 2 · Critical Illness</text>
    <rect x="60" y="264" width="150" height="34" rx="7" fill="#0f172a" stroke="#334155"/><text x="72" y="286">Step 3 · Hospital Indem.</text>
    <rect x="60" y="306" width="150" height="34" rx="7" fill="#0f172a" stroke="#334155"/><text x="72" y="328">Step 4 · Dependents</text>
    <rect x="60" y="348" width="150" height="34" rx="7" fill="#0f172a" stroke="#334155"/><text x="72" y="370">Step 5 · Review</text>
  </g>
  <!-- step highlight cycling -->
  <rect x="60" width="150" height="34" rx="7" fill="none" stroke="#fbbf24" stroke-width="3">
    <animate attributeName="y" values="180;222;264;306;348;180" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- moving request token -->
  <g filter="url(#glow2)">
    <circle r="9" fill="#fbbf24">
      <animate attributeName="cx" values="230;470;230;470;230;470;230;470;230;470" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="197;200;239;240;281;300;323;360;365;200" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Load balancer -->
  <rect x="300" y="250" width="160" height="50" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="380" y="280" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">Ingress / LB</text>
  <text x="380" y="230" fill="#7c8aa5" font-size="12" text-anchor="middle">no sticky sessions</text>

  <!-- UI pods -->
  <text x="520" y="150" fill="#94a3b8" font-size="14" font-weight="600">STATELESS UI PODS</text>
  <g>
    <rect x="520" y="165" width="110" height="55" rx="10" fill="#0f766e" stroke="#2dd4bf"/><text x="575" y="198" fill="#ccfbf1" font-size="13" text-anchor="middle">ui-pod-A</text>
    <rect x="520" y="235" width="110" height="55" rx="10" fill="#0f766e" stroke="#2dd4bf"/><text x="575" y="268" fill="#ccfbf1" font-size="13" text-anchor="middle">ui-pod-B</text>
    <rect x="520" y="305" width="110" height="55" rx="10" fill="#0f766e" stroke="#2dd4bf"/><text x="575" y="338" fill="#ccfbf1" font-size="13" text-anchor="middle">ui-pod-C</text>
  </g>
  <!-- active pod ring jumps around to show any pod handles any step -->
  <rect x="520" width="110" height="55" rx="10" fill="none" stroke="#f472b6" stroke-width="3">
    <animate attributeName="y" values="165;305;235;165;305;165" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Redis session -->
  <rect x="700" y="200" width="250" height="150" rx="14" fill="#1e293b" stroke="#dc2626"/>
  <text x="825" y="232" fill="#f87171" font-size="16" font-weight="700" text-anchor="middle">Redis Session Store</text>
  <text x="825" y="258" fill="#7c8aa5" font-size="13" text-anchor="middle" font-family="monospace">session:{quoteId}</text>
  <text x="720" y="288" fill="#cbd5e1" font-size="13" font-family="monospace">tier: AD&amp;D-GOLD</text>
  <text x="720" y="310" fill="#cbd5e1" font-size="13" font-family="monospace">riders: [CI, HI]</text>
  <text x="720" y="332" fill="#cbd5e1" font-size="13" font-family="monospace">TTL: 30m  ·  step:
    <tspan fill="#fbbf24">
      <animate attributeName="opacity" values="1" dur="8s" repeatCount="indefinite"/>5</tspan></text>

  <!-- read/write pulse to redis -->
  <path d="M630 275 L700 275" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 7" fill="none">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="0.5s" repeatCount="indefinite"/>
  </path>
  <path d="M460 275 L520 275" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 7" fill="none">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="0.5s" repeatCount="indefinite"/>
  </path>
  <path d="M230 270 L300 275" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="7 7" fill="none">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="0.5s" repeatCount="indefinite"/>
  </path>

  <text x="40" y="430" fill="#64748b" font-size="13">Kill ui-pod-B mid-enrollment → ui-pod-C rehydrates session:{quoteId} from Redis → zero progress lost.</text>
  <rect x="40" y="450" width="910" height="40" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="475" fill="#22c55e" font-size="14" font-family="monospace">POST /enroll/step → 200 OK  ·  session rehydrated from Redis  ·  pod identity irrelevant</text>
</svg>
